<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京 気象板</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: serif;
  }
  body {
    text-align: center;
    padding: 18px 14px 24px;
  }
  .place {
    font-size: 30px;
    margin: 0 0 5px;
  }
  .updated {
    font-size: 16px;
    margin-bottom: 14px;
  }
  .pressure {
    font-size: 64px;
    font-weight: bold;
    line-height: 1.05;
    margin: 6px 0 4px;
  }
  .pressure .unit {
    font-size: 26px;
  }
  .delta {
    font-size: 24px;
    margin: 8px 0 5px;
  }
  .delta-sub {
    font-size: 16px;
    margin: 0 0 18px;
  }
  .current {
    font-size: 25px;
    margin: 8px 0 18px;
  }
  .rule {
    border-top: 2px solid #000;
    margin: 0 0 17px;
  }
  .forecast {
    font-size: 27px;
    font-weight: bold;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .info {
    display: table;
    width: 100%;
    table-layout: fixed;
    font-size: 22px;
    line-height: 1.7;
  }
  .info-row {
    display: table-row;
  }
  .info-cell {
    display: table-cell;
    width: 50%;
    vertical-align: middle;
  }
  .rain {
    font-size: 25px;
    margin: 6px 0 3px;
  }
  .wind {
    font-size: 24px;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="place">東京</div>
  <div class="updated">2026年08月10日 00:42 更新</div>

  <div class="pressure">1003.9 <span class="unit">hPa</span></div>
  <div class="delta">→ +0.2 hPa / 24h</div>
  <div class="delta-sub">24時間前 1003.7 hPa</div>

  <div class="current">現在 23.7 ℃　　湿度 95 %</div>

  <div class="rule"></div>

  <div class="forecast">
    今日 ↑30 ℃（14時頃）<br>
    明朝 ↓21 ℃（05時頃）
  </div>

  <div class="rain">降水確率 82 %</div>

  <div class="info">
    <div class="info-row">
      <div class="info-cell">日の出 04:56</div>
      <div class="info-cell">日の入 18:37</div>
    </div>
  </div>

  <div class="wind">北 0.6 m/s</div>
</body>
</html>
