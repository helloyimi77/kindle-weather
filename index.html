<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>東京　羽田 気象板</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #000;
  font-family: serif;
}

body {
  text-align: center;
  padding: 12px 12px 16px;
}

/* ==============================
   タイトル
   ============================== */

.place {
  font-size: 29px;
  margin: 0 0 2px;
}

.updated {
  font-size: 14px;
  margin-bottom: 7px;
}


/* ==============================
   上段
   天気 ｜ 気圧 ｜ 風
   ============================== */

.main-panel {
  display: table;
  width: 100%;
  table-layout: fixed;
  margin: 2px 0 8px;
}

.main-cell {
  display: table-cell;
  vertical-align: middle;
}


/* 左：現在天気 */

.weather-cell {
  width: 25%;
}

.weather-icon {
  font-size: 52px;
  line-height: 1.0;
  margin-bottom: 3px;
}

.weather-text {
  font-size: 20px;
  font-weight: bold;
}


/* 中央：気圧 */

.pressure-cell {
  width: 50%;
}

.pressure {
  font-size: 58px;
  font-weight: bold;
  line-height: 1.03;
  white-space: nowrap;
}

.pressure .unit {
  font-size: 23px;
}

.delta {
  font-size: 21px;
  margin-top: 5px;
  white-space: nowrap;
}

.delta-sub {
  font-size: 14px;
  margin-top: 2px;
}


/* 右：風 */

.wind-cell {
  width: 25%;
}

.wind-arrow {
  font-size: 52px;
  font-weight: bold;
  line-height: 0.95;
}

.wind-speed {
  font-size: 21px;
  font-weight: bold;
  margin-top: 3px;
}

.wind-direction {
  font-size: 19px;
  margin-top: 2px;
}


/* ==============================
   現在気温など
   ============================== */

.current {
  font-size: 23px;
  margin: 5px 0 7px;
}

.sky {
  font-size: 17px;
  margin: 3px 0 8px;
}


/* ==============================
   区切り線
   ============================== */

.rule {
  border-top: 2px solid #000;
  margin: 5px 0 9px;
}


/* ==============================
   最高・最低
   ============================== */

.forecast {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.4;
  margin-bottom: 3px;
}

.rain {
  font-size: 21px;
  margin: 2px 0 4px;
}


/* ==============================
   今日の傾向
   ============================== */

.trend-title {
  margin: 7px 0 3px;
  font-size: 18px;
  font-weight: bold;
}

.trend {
  font-size: 19px;
  line-height: 1.4;
  margin-bottom: 5px;
}


/* ==============================
   時間別
   ============================== */

.hourly {
  width: 100%;
  margin: 0 auto;
  border-collapse: collapse;
  font-size: 18px;
  line-height: 1.35;
}

.hourly td {
  width: 50%;
  padding: 2px 4px;
  text-align: center;
  white-space: nowrap;
}

</style>


<script>

/*
  Kindle用 安全更新

  ・ページ全体をreloadしない
  ・10分ごとに裏で最新版HTMLを取得
  ・取得成功時だけbodyを書き換える
  ・通信失敗時は現在画面をそのまま維持
*/

(function () {

  var UPDATE_INTERVAL =
    10 * 60 * 1000;   // 10分

  function updateWeather() {

    try {

      var xhr =
        new XMLHttpRequest();

      /*
        キャッシュ回避用に時刻を付加
      */
      var url =
        window.location.pathname +
        "?kindle_update=" +
        new Date().getTime();

      xhr.open(
        "GET",
        url,
        true
      );

      xhr.onreadystatechange =
        function () {

          /*
            通信完了まで何もしない
          */
          if (xhr.readyState !== 4) {
            return;
          }

          /*
            成功した場合だけ更新
          */
          if (
            xhr.status >= 200 &&
            xhr.status < 300 &&
            xhr.responseText
          ) {

            try {

              /*
                最新HTMLからbody部分だけ取り出す
              */
              var match =
                xhr.responseText.match(
                  /<body[^>]*>([\s\S]*?)<\/body>/i
                );

              if (
                match &&
                match[1]
              ) {

                /*
                  現在ページは移動せず、
                  画面内容だけ最新版へ交換
                */
                document.body.innerHTML =
                  match[1];

              }

            } catch (e) {

              /*
                HTML解析失敗時も
                現在画面をそのまま維持
              */

            }

          }

          /*
            404 / 500 / 504 / Wi-Fi切断などは
            何もしない。
            次の10分後に再試行。
          */

        };

      xhr.send(null);

    } catch (e) {

      /*
        通信開始自体に失敗しても
        現在画面を維持
      */

    }

  }


  /*
    10分ごとに繰り返し
  */
  setInterval(
    updateWeather,
    UPDATE_INTERVAL
  );

})();

</script>

</head>


<body>
