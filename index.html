<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="480">
<title>羽田空港 気象板</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: serif;
  }

  body {
    text-align: center;
    padding: 14px 12px 18px;
  }

  .place {
    font-size: 30px;
    margin: 0 0 3px;
  }

  .updated {
    font-size: 15px;
    margin-bottom: 10px;
  }

  .pressure {
    font-size: 60px;
    font-weight: bold;
    line-height: 1.03;
    margin: 4px 0 3px;
  }

  .pressure .unit {
    font-size: 24px;
  }

  .delta {
    font-size: 22px;
    margin: 6px 0 3px;
  }

  .delta-sub {
    font-size: 15px;
    margin: 0 0 12px;
  }

  .current {
    font-size: 24px;
    margin: 6px 0 12px;
  }

  .rule {
    border-top: 2px solid #000;
    margin: 0 0 11px;
  }

  .forecast {
    font-size: 24px;
    font-weight: bold;
    line-height: 1.45;
    margin-bottom: 5px;
  }

  .rain {
    font-size: 22px;
    margin: 3px 0 8px;
  }

  .sky {
    font-size: 18px;
    line-height: 1.5;
    margin: 6px 0;
  }

  .wind {
    font-size: 21px;
    margin-top: 4px;
    margin-bottom: 6px;
  }

  .trend-title {
    margin: 12px 0 6px;
    font-size: 19px;
    font-weight: bold;
  }

  .trend {
    font-size: 21px;
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .hourly {
    width: 100%;
    margin: 0 auto;
    border-collapse: collapse;
    font-size: 20px;
    line-height: 1.6;
  }

  .hourly td {
    width: 50%;
    padding: 4px 6px;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>

<body>

  <div class="place">東京 羽田</div>

  <div class="updated">
    2026年08月11日 00:09 更新
  </div>

  <div class="pressure">
    1006.0
    <span class="unit">hPa</span>
  </div>

  <div class="delta">
    ↘ -3.0 hPa / 24h
  </div>

  <div class="delta-sub">
    24時間前 1009.0 hPa
  </div>

  <div class="current">
    現在 24.0 ℃　　湿度 78 %
  </div>

  <div class="rule"></div>

  <div class="forecast">
    今日 ↑28 ℃（11時頃）<br>
    明朝 ↓21 ℃（05時頃）
  </div>

  <div class="rain">
    降水確率 100 %
  </div>

  <div class="sky">
    雲量 7/8　　雲底 0.5km　　露点 20.0℃
  </div>

  <div class="wind">
    北東 6.7 m/s
  </div>

  <div class="trend-title">
    ──── 今日の傾向 ────
  </div>

  <div class="trend">
    午前：くもり<br>
    午後：雨<br>
    気圧：下降傾向
  </div>

  <table class="hourly">
    <tr>
      <td>06時 24℃ 0%</td>
      <td>09時 26℃ 0%</td>
    </tr>

    <tr>
      <td>12時 27℃ 6%</td>
      <td>15時 26℃ 81%</td>
    </tr>

    <tr>
      <td>18時 25℃ 100%</td>
      <td>21時 24℃ 100%</td>
    </tr>
  </table>

</body>
</html>
