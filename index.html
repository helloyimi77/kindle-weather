<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>東京　羽田 気象板</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #000;
  font-family: serif;
}

body {
  text-align: center;
  padding: 12px 12px 16px;
}

/* ==============================
   タイトル
   ============================== */

.place {
  font-size: 29px;
  margin: 0 0 2px;
}

.updated {
  font-size: 14px;
  margin-bottom: 7px;
}


/* ==============================
   上段
   天気 ｜ 気圧 ｜ 風
   ============================== */

.main-panel {
  display: table;
  width: 100%;
  table-layout: fixed;
  margin: 2px 0 8px;
}

.main-cell {
  display: table-cell;
  vertical-align: middle;
}


/* 左：現在天気 */

.weather-cell {
  width: 25%;
}

.weather-icon {
  font-size: 52px;
  line-height: 1.0;
  margin-bottom: 3px;
}

.weather-text {
  font-size: 20px;
  font-weight: bold;
}


/* 中央：気圧 */

.pressure-cell {
  width: 50%;
}

.pressure {
  font-size: 58px;
  font-weight: bold;
  line-height: 1.03;
  white-space: nowrap;
}

.pressure .unit {
  font-size: 23px;
}

.delta {
  font-size: 21px;
  margin-top: 5px;
  white-space: nowrap;
}

.delta-sub {
  font-size: 14px;
  margin-top: 2px;
}


/* 右：風 */

.wind-cell {
  width: 25%;
}

.wind-arrow {
  font-size: 52px;
  font-weight: bold;
  line-height: 0.95;
}

.wind-speed {
  font-size: 21px;
  font-weight: bold;
  margin-top: 3px;
}

.wind-direction {
  font-size: 19px;
  margin-top: 2px;
}


/* ==============================
   現在気温など
   ============================== */

.current {
  font-size: 23px;
  margin: 5px 0 7px;
}

.sky {
  font-size: 17px;
  margin: 3px 0 8px;
}


/* ==============================
   区切り線
   ============================== */

.rule {
  border-top: 2px solid #000;
  margin: 5px 0 9px;
}


/* ==============================
   最高・最低
   ============================== */

.forecast {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.4;
  margin-bottom: 3px;
}

.rain {
  font-size: 21px;
  margin: 2px 0 4px;
}


/* ==============================
   今日の傾向
   ============================== */

.trend-title {
  margin: 7px 0 3px;
  font-size: 18px;
  font-weight: bold;
}

.trend {
  font-size: 19px;
  line-height: 1.4;
  margin-bottom: 5px;
}


/* ==============================
   時間別
   ============================== */

.hourly {
  width: 100%;
  margin: 0 auto;
  border-collapse: collapse;
  font-size: 18px;
  line-height: 1.35;
}

.hourly td {
  width: 50%;
  padding: 2px 4px;
  text-align: center;
  white-space: nowrap;
}

</style>


<script>

(function () {

  var UPDATE_INTERVAL =
    10 * 60 * 1000;

  function updateWeather() {

    try {

      var xhr =
        new XMLHttpRequest();

      var url =
        window.location.pathname +
        "?kindle_update=" +
        new Date().getTime();

      xhr.open(
        "GET",
        url,
        true
      );

      xhr.onreadystatechange =
        function () {

          if (xhr.readyState !== 4) {
            return;
          }

          if (
            xhr.status >= 200 &&
            xhr.status < 300 &&
            xhr.responseText
          ) {

            try {

              var html =
                xhr.responseText;

              var lowerHtml =
                html.toLowerCase();

              /*
                タグ名を分割して生成する。
                取得対象HTML内のこのスクリプト自身を
                開始位置として誤認しないため。
              */

              var startMarker =
                "<" + "bo" + "dy";

              var endMarker =
                "</" + "bo" + "dy>";

              var start =
                lowerHtml.indexOf(
                  startMarker
                );

              if (start < 0) {
                return;
              }

              start =
                html.indexOf(
                  ">",
                  start
                );

              if (start < 0) {
                return;
              }

              start =
                start + 1;

              var end =
                lowerHtml.lastIndexOf(
                  endMarker
                );

              if (
                end < 0 ||
                end <= start
              ) {
                return;
              }

              var newBody =
                html.substring(
                  start,
                  end
                );

              document.body.innerHTML =
                newBody;

            } catch (e) {

              /*
                解析に失敗した場合は
                現在の表示を維持する。
              */

            }

          }

          /*
            通信エラーの場合も画面は変更しない。
            次回の定期処理で再試行する。
          */

        };

      xhr.send(null);

    } catch (e) {

      /*
        現在の表示を維持する。
      */

    }

  }


  setInterval(
    updateWeather,
    UPDATE_INTERVAL
  );

})();

</script>

</head>


<body>

<div class="place">
  東京　羽田
</div>

<div class="updated">
  2026年08月21日 07:10 更新
</div>


<div class="main-panel">

  <div class="main-cell weather-cell">

    <div class="weather-icon">
      ☁
    </div>

    <div class="weather-text">
      くもり
    </div>

  </div>


  <div class="main-cell pressure-cell">

    <div class="pressure">
      1013.0
      <span class="unit">hPa</span>
    </div>

    <div class="delta">
      ↘ -3.0 hPa / 24h
    </div>

    <div class="delta-sub">
      24時間前 1016.0 hPa
    </div>

  </div>


  <div class="main-cell wind-cell">

    <div class="wind-arrow">
      ↑
    </div>

    <div class="wind-speed">
      4.6 m/s
    </div>

    <div class="wind-direction">
      南
    </div>

  </div>

</div>


<div class="current">
  現在 29.0 ℃　湿度 79 %
</div>

<div class="sky">
  雲量 7/8　
  雲底 0.3 km　
  露点 25.0 ℃
</div>


<div class="rule"></div>


<div class="forecast">

  今日 ↑31 ℃
  （14時頃）

  <br>

  明朝 ↓26 ℃
  （03時頃）

</div>


<div class="rain">
  降水確率 0 %
</div>


<div class="trend-title">
  ──── 今日の傾向 ────
</div>

<div class="trend">

  午前：くもり

  <br>

  午後：くもり

  <br>

  気圧：ほぼ横ばい

</div>


<table class="hourly">

  <tr>

    <td>
      06時 --℃ --%
    </td>

    <td>
      09時 28℃ 0%
    </td>

  </tr>


  <tr>

    <td>
      12時 30℃ 0%
    </td>

    <td>
      15時 30℃ 0%
    </td>

  </tr>


  <tr>

    <td>
      18時 28℃ 0%
    </td>

    <td>
      21時 27℃ 0%
    </td>

  </tr>

</table>


</body>
</html>
